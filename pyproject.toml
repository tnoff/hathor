[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hathor"
dynamic = ["version"]
description = "Hathor Audio File Manager"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"}
]
requires-python = ">=3.10"
dependencies = [
    "alembic==1.20.0",
    "click==8.5.0",
    # dappertable is GitHub-canonical, not on PyPI. Pinned to a tagged tarball
    # the same way discord-bot pins it.
    "dappertable @ https://github.com/tnoff/dappertable/archive/refs/tags/v1.1.8.tar.gz",
    "feedparser==6.0.14",
    "google-api-python-client==2.201.0",
    "mutagen==1.48.1",
    "pyaml-env==1.2.2",
    "requests==2.34.2",
    "SQLAlchemy==2.1.4",
    "validators==0.35.0",
    "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-mock==3.16.0",
    "pytest-cov==7.1.0",
    "tox==4.64.10",
    "pylint==4.1.2",
    "requests-mock==1.12.1",
    "bandit==1.9.4",
]

[project.scripts]
hathor = "hathor.cli:main"
audio-tool = "hathor.audio.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
"hathor.database.migrations" = ["script.py.mako"]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hathor"
dynamic = ["version"]
description = "Hathor Audio File Manager"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"}
]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "click==8.5.0",
    # dappertable is GitHub-canonical, not on PyPI. Pinned to a tagged tarball
    # the same way discord-bot pins it.
    "dappertable @ https://github.com/tnoff/dappertable/archive/refs/tags/v1.1.8.tar.gz",
    "feedparser==6.0.14",
    "google-api-python-client==2.201.0",
    "mutagen==1.48.1",
    # OTLP export is opt-in: nothing is set up unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
    # The http exporter is used over grpc to stay pure python (no grpcio wheels to track)
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "opentelemetry-instrumentation-requests==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "Pillow==13.0.0",
    "pyaml-env==1.2.2",
    "requests==2.34.2",
    "SQLAlchemy==2.1.6",
    "validators==0.36.0",
    "yt-dlp==2026.10.21",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-mock==3.17.0",
    "pytest-cov==7.1.0",
    "tox==4.67.1",
    "pylint==4.1.3",
    "requests-mock==1.12.1",
    "bandit==1.9.4",
]

[project.scripts]
hathor = "hathor.cli:main"
audio-tool = "hathor.audio.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
"hathor.database.migrations" = ["script.py.mako"]

name: Publish TechDocs

# Builds this repo's mkdocs.yml + docs/ with @techdocs/cli and publishes
# straight to the S3-compatible TechDocs storage bucket. The backstage
# backend runs with techdocs.builder: external because it has no Docker, so
# something else has to build and publish -- see docker-apps +
# tnoff/backstage#20. Same setup as terraform-modules and github-workflows.
#
# TECHDOCS_S3_* secrets come from oci/oci.tf's backstage_techdocs_ci_creds --
# a bucket-only identity, separate from the one the backstage pod itself
# uses, wired in by infra/repos.tf's hathor module.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs-publish.yml'

concurrency:
  group: techdocs-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish
    uses: tnoff/github-workflows/.github/workflows/techdocs-publish.yml@111e2ebb71a422526b5e04e7294bd2b886289b8f
    with:
      entity_ref: default/Component/hathor
    secrets:
      techdocs_s3_access_key_id: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      techdocs_s3_secret_access_key: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
      techdocs_s3_bucket_name: ${{ secrets.TECHDOCS_S3_BUCKET_NAME }}
      techdocs_s3_endpoint: ${{ secrets.TECHDOCS_S3_ENDPOINT }}
      techdocs_s3_region: ${{ secrets.TECHDOCS_S3_REGION }}

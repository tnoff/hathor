name: Release

# Default-branch pipeline, replacing the GitLab `push` stage.
#
# The three jobs are a two-pass design carried over from GitLab.
# assemble-changelog folds any pending changelog.d fragments into CHANGELOG.md
# and pushes; tag runs with gate_on_fragments and DEFERS while fragments are
# still present, so this pass cuts no tag. That fold push then triggers a fresh
# run of this workflow where the fragment directory is empty, the gate passes,
# and tag + release run against the assembled changelog.
#
# The push token must therefore be a PAT, not GITHUB_TOKEN: a GITHUB_TOKEN push
# triggers no follow-up run, so the second pass never happens and no release is
# ever cut -- with every job green.
#
# There is no image job here. The GitLab config included buildkit-build-check
# but NOT buildkit-docker-push, so this repo validates that its Dockerfile
# builds and never publishes the result.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  tag:
    name: Tag
    needs: assemble-changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/tag.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      gate_on_fragments: true
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  release:
    name: Release
    needs: tag
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/release.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      version: ${{ needs.tag.outputs.version }}
      tag_created: ${{ needs.tag.outputs.tag_created }}

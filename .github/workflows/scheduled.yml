name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!258.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '16 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@8f112893cd17d68fe039d3ba2643d2881bfafdcb
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@8f112893cd17d68fe039d3ba2643d2881bfafdcb
    with:
      age_days: 30
      dry_run: false
